<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Priyanshi's Notes Hub ✨ | IT/ITeS 12th</title>

  <!-- SweetAlert2 CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- iziToast CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/css/iziToast.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/js/iziToast.min.js"></script>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.6);
      --text: #1c1c1e;
      --text-muted: #8e8e93;
      --accent: #ff4d6d;
      --accent-soft: rgba(255, 77, 109, 0.12);
      --apple-blue: #007aff;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      --header-bg: rgba(242, 242, 247, 0.82);
    }

    [data-theme="dark"] {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f7;
      --text-muted: #98989d;
      --accent: #ff758f;
      --accent-soft: rgba(255, 117, 143, 0.16);
      --apple-blue: #0a84ff;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
      --header-bg: rgba(0, 0, 0, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.4s ease, color 0.4s ease;
      overflow-x: hidden;
    }

    /* === Cute Splash Screen === */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
    }

    .doodle-box {
      width: 140px;
      height: 140px;
      position: relative;
      animation: floatDoodle 2.6s ease-in-out infinite alternate;
    }

    @keyframes floatDoodle {
      0% { transform: translateY(0) rotate(-2deg); }
      100% { transform: translateY(-14px) rotate(3deg); }
    }

    .splash-title {
      font-size: 26px;
      font-weight: 700;
      margin-top: 24px;
      letter-spacing: -0.5px;
    }

    .splash-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* === Top Bar (macOS & iOS Hybrid Minimal) === */
    .top-bar {
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      background: var(--header-bg);
      border-bottom: 0.5px solid var(--card-border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .traffic-lights {
      display: flex;
      gap: 7px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    .bar-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      transition: all 0.25s ease;
    }

    .theme-btn:active {
      transform: scale(0.94);
    }

    /* === Main Canvas === */
    main {
      width: 100%;
      max-width: 720px;
      padding: 24px 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Welcome Header */
    .welcome-card {
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 30px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      width: fit-content;
    }

    .welcome-card h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
      line-height: 1.15;
    }

    .welcome-card p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Papers List */
    .pdf-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .paper-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 16px 18px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }

    .paper-card:hover {
      transform: translateY(-2px);
    }

    .paper-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .file-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: white;
      box-shadow: 0 6px 16px rgba(255, 77, 109, 0.3);
    }

    .paper-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .paper-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .paper-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .paper-meta span {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .pill-year {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 11px;
    }

    /* Apple-style Action Buttons */
    .paper-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-preview {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-preview:hover {
      background: rgba(120, 120, 128, 0.12);
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 77, 109, 0.35);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-download:hover {
      opacity: 0.95;
      transform: scale(1.03);
    }

    .btn-download:active {
      transform: scale(0.96);
    }

    /* SweetAlert Custom Apple Theme */
    .swal2-popup.apple-modal {
      border-radius: 28px !important;
      padding: 24px 20px !important;
      background: var(--card-bg) !important;
      backdrop-filter: blur(30px) !important;
      -webkit-backdrop-filter: blur(30px) !important;
      border: 1px solid var(--card-border) !important;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2) !important;
    }

    .smile-box {
      margin: 15px 0 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .smile-interactive-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 22px rgba(255, 77, 109, 0.4);
      animation: pulseSmile 1.8s infinite alternate;
      transition: transform 0.2s ease;
    }

    .smile-interactive-btn:active {
      transform: scale(0.92);
    }

    @keyframes pulseSmile {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    .smile-face-preview {
      font-size: 64px;
      line-height: 1;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Footer */
    footer {
      margin-top: auto;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <!-- 1. CUTE DOODLE SPLASH SCREEN -->
  <div id="splash-screen">
    <div class="doodle-box">
      <!-- Cute Smiling Bear / Cat Doodle SVG -->
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="28" cy="28" r="14" fill="#FFB4C2" />
        <circle cx="72" cy="28" r="14" fill="#FFB4C2" />
        <circle cx="28" cy="28" r="7" fill="#FF758F" />
        <circle cx="72" cy="28" r="7" fill="#FF758F" />
        <circle cx="50" cy="54" r="38" fill="#FFE5EC" />
        <ellipse cx="38" cy="50" rx="3.5" ry="5" fill="#333" />
        <ellipse cx="62" cy="50" rx="3.5" ry="5" fill="#333" />
        <ellipse cx="30" cy="58" rx="5" ry="3.5" fill="#FF758F" opacity="0.6" />
        <ellipse cx="70" cy="58" rx="5" ry="3.5" fill="#FF758F" opacity="0.6" />
        <path d="M47 56L53 56L50 60Z" fill="#FF4D6D" />
        <path d="M44 63C46.5 67 53.5 67 56 63" stroke="#333" stroke-width="2.5" stroke-linecap="round" />
        <path d="M50 14L52 8L55 12" stroke="#FF4D6D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <div class="splash-title">Hi Priyanshi! ✨</div>
    <div class="splash-subtitle">Preparing your IT/ITeS papers...</div>
  </div>

  <!-- 2. MINIMAL TOP BAR -->
  <header class="top-bar">
    <div class="traffic-lights">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="bar-title">
      <span>IT/ITeS Hub</span>
    </div>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span>
      <span id="theme-text">Dark</span>
    </button>
  </header>

  <!-- 3. MAIN CONTENT -->
  <main>
    <section class="welcome-card">
      <div class="badge">🌸 Special Edition for Priyanshi</div>
      <h1>JAC Class 12th Papers</h1>
      <p>Sara papers ek jagah ready hain. Just click download, smile karo aur download start! 📚</p>
    </section>

    <!-- PAPERS LIST -->
    <section class="pdf-list" id="papers-container">
      <!-- Cards rendered via JavaScript -->
    </section>

    <footer>
      Crafted with love for Priyanshi • Easy Peasy Study Space ✨
    </footer>
  </main>

  <script>
    // File details matching your folder
    const papers = [
      {
        fileName: "jac-class-12-it-ites-42010-2024.pdf",
        title: "Annual Intermediate Exam 2024",
        sub: "JAC IT/ITeS Vocational (42010)",
        year: "2024",
        size: "344 KB",
        iconText: "24"
      },
      {
        fileName: "jac-class-12-it-ites-1010-2023.pdf",
        title: "Annual Intermediate Exam 2023",
        sub: "JAC IT/ITeS Vocational (1010)",
        year: "2023",
        size: "398 KB",
        iconText: "23"
      },
      {
        fileName: "jac-class-12-it-ites-2670.pdf",
        title: "Official Model Question Paper",
        sub: "JAC IT/ITeS Vocational (2670)",
        year: "Set-1",
        size: "354 KB",
        iconText: "SET"
      },
      {
        fileName: "jac-class-12-it-ites-2670-2026.pdf",
        title: "Model Question Paper 2026",
        sub: "JAC IT/ITeS Vocational (2670-2026)",
        year: "2026",
        size: "354 KB",
        iconText: "26"
      }
    ];

    // Render Papers
    function renderPapers() {
      const container = document.getElementById("papers-container");
      container.innerHTML = papers.map((paper, index) => `
        <div class="paper-card">
          <div class="paper-left">
            <div class="file-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
            </div>
            <div class="paper-details">
              <div class="paper-title">${paper.title}</div>
              <div class="paper-meta">
                <span class="pill-year">${paper.year}</span>
                <span>•</span>
                <span>${paper.size}</span>
              </div>
            </div>
          </div>
          <div class="paper-actions">
            <button class="btn-preview" title="Quick View" onclick="viewPdf('${paper.fileName}')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
            <button class="btn-download" onclick="triggerSmileDownload('${paper.fileName}', '${paper.title}')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>Get</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    // View PDF directly in new tab
    function viewPdf(fileName) {
      window.open(fileName, '_blank');
    }

    // 4. SMILE TO DOWNLOAD INTERACTION
    function triggerSmileDownload(fileName, title) {
      Swal.fire({
        title: '<span style="font-size: 20px; font-weight:800;">Smile Verification Required! 😊</span>',
        html: `
          <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 12px;">
            Priyanshi, download karne se pehle pyari si smile do! ✨
          </p>
          <div class="smile-box">
            <div id="smileFace" class="smile-face-preview">😐</div>
            <button id="giveSmileBtn" class="smile-interactive-btn" onclick="acceptSmile('${fileName}', '${title}')">
              <span>Touch to Smile! 🥰</span>
            </button>
          </div>
        `,
        showConfirmButton: false,
        showCloseButton: true,
        customClass: {
          popup: 'apple-modal'
        }
      });
    }

    // Accept Smile & Trigger Download
    function acceptSmile(fileName, title) {
      const face = document.getElementById("smileFace");
      if (face) {
        face.textContent = "🥰✨";
        face.style.transform = "scale(1.3) rotate(6deg)";
      }

      // Confetti burst
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#ff4d6d', '#ff758f', '#007aff', '#ffbd2e']
      });

      // Close modal smoothly
      setTimeout(() => {
        Swal.close();

        // iziToast notification
        iziToast.show({
          title: 'Smile Verified! 🥰',
          message: `${title} is downloading now!`,
          position: 'topCenter',
          theme: 'light',
          backgroundColor: '#ff4d6d',
          titleColor: '#ffffff',
          messageColor: '#ffffff',
          iconColor: '#ffffff',
          progressBarColor: '#ffffff',
          timeout: 4000
        });

        // Trigger real file download
        const a = document.createElement('a');
        a.href = fileName;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }, 550);
    }

    // 5. THEME TOGGLE (LIGHT / DARK)
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const newTheme = currentTheme === "dark" ? "light" : "dark";
      setTheme(newTheme);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("priyanshi_theme", theme);
      const icon = document.getElementById("theme-icon");
      const text = document.getElementById("theme-text");

      if (theme === "dark") {
        icon.textContent = "☀️";
        text.textContent = "Light";
      } else {
        icon.textContent = "🌙";
        text.textContent = "Dark";
      }
    }

    // Init Theme & Splash Screen dismiss
    window.addEventListener("DOMContentLoaded", () => {
      // Saved Theme or system preference
      const savedTheme = localStorage.getItem("priyanshi_theme") || 
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      setTheme(savedTheme);

      renderPapers();

      // Fade out splash screen after 1.6s
      setTimeout(() => {
        const splash = document.getElementById("splash-screen");
        splash.style.opacity = "0";
        setTimeout(() => {
          splash.style.visibility = "hidden";
          // Welcome greeting toast
          iziToast.info({
            title: 'Welcome Priyanshi! 🌸',
            message: 'All your Class 12 IT/ITeS papers are ready.',
            position: 'topRight',
            timeout: 3500
          });
        }, 600);
      }, 1600);
    });
  </script>
</body>
</html>
